<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1024 500" width="1024" height="500" preserveAspectRatio="xMidYMid slice"
     font-family="DM Sans, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <!-- Diagonal rainbow gradient (matches the app icon's peeling-page palette) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="28%"  stop-color="#3b82f6"/>
      <stop offset="55%"  stop-color="#6366f1"/>
      <stop offset="78%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Soft white highlight glow -->
    <radialGradient id="glow" cx="80%" cy="0%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink corner glow -->
    <radialGradient id="pinkGlow" cx="10%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone-screen background -->
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>

    <!-- Subtle shadow under the phone -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.28"/>
    </filter>

    <!-- Phone screen rounded clip -->
    <clipPath id="phoneClip">
      <rect x="14" y="14" width="252" height="472" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- ─── BACKGROUND ─────────────────────────────────────────────────────── -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>
  <rect width="1024" height="500" fill="url(#pinkGlow)"/>

  <!-- Soft diagonal sheen for depth -->
  <polygon points="0,0 1024,0 1024,80 0,260" fill="#ffffff" fill-opacity="0.05"/>
  <polygon points="0,500 1024,500 1024,440 0,300" fill="#000000" fill-opacity="0.06"/>

  <!-- ─── LEFT: WORDMARK + TAGLINE ───────────────────────────────────────── -->
  <!-- App icon (rounded, with white ring) -->
  <g transform="translate(72, 96)">
    <rect x="-2" y="-2" width="68" height="68" rx="18" ry="18" fill="#ffffff" fill-opacity="0.25"/>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="64" height="64" rx="16" ry="16"/>
    </clipPath>
    <image href="../public/icon-512.png" x="0" y="0" width="64" height="64"
           clip-path="url(#iconClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Wordmark -->
  <text x="156" y="146" fill="#ffffff" font-size="44" font-weight="700"
        letter-spacing="-0.5" style="text-shadow: 0 2px 8px rgba(0,0,0,0.18);">DayFlow</text>

  <!-- Tagline -->
  <text x="72" y="240" fill="#ffffff" font-size="56" font-weight="700"
        letter-spacing="-1.2">Tu día,</text>
  <text x="72" y="304" fill="#ffffff" font-size="56" font-weight="700"
        font-style="italic" letter-spacing="-1.2">en orden.</text>

  <!-- Feature line -->
  <text x="72" y="372" fill="#ffffff" fill-opacity="0.92" font-size="18" font-weight="500"
        letter-spacing="0.4">Calendario  ·  Tareas  ·  Compartido</text>

  <!-- Feature pills row -->
  <g transform="translate(72, 400)" font-size="13" font-weight="600" fill="#ffffff">
    <g>
      <rect x="0"   y="0" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.30"/>
      <text x="14"  y="21">📅  Calendario</text>
    </g>
    <g transform="translate(128, 0)">
      <rect x="0"   y="0" width="92"  height="32" rx="16" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.30"/>
      <text x="14"  y="21">✓  Tareas</text>
    </g>
    <g transform="translate(230, 0)">
      <rect x="0"   y="0" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.30"/>
      <text x="14"  y="21">👥  Compartido</text>
    </g>
  </g>

  <!-- ─── RIGHT: TILTED PHONE MOCKUP ─────────────────────────────────────── -->
  <g transform="translate(640, -30) rotate(8 140 250)" filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="280" height="500" rx="40" ry="40" fill="#0f172a"/>
    <!-- Inner screen -->
    <rect x="14" y="14" width="252" height="472" rx="28" ry="28" fill="url(#screen)"/>

    <g clip-path="url(#phoneClip)">
      <!-- Status bar -->
      <text x="40" y="42" fill="#0f172a" font-size="11" font-weight="700">9:41</text>
      <circle cx="220" cy="38"  r="3" fill="#0f172a"/>
      <circle cx="232" cy="38"  r="3" fill="#0f172a"/>
      <rect   x="240" y="34" width="16" height="8" rx="2" fill="#0f172a"/>

      <!-- Header: month + year -->
      <text x="40" y="92"  fill="#0f172a" font-size="22" font-weight="700">Mayo 2026</text>
      <text x="40" y="116" fill="#64748b" font-size="11" font-weight="500">Sábado, 16 de mayo</text>

      <!-- Weekday row -->
      <g fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1">
        <text x="38"  y="148">L</text>
        <text x="70"  y="148">M</text>
        <text x="102" y="148">X</text>
        <text x="134" y="148">J</text>
        <text x="166" y="148">V</text>
        <text x="198" y="148">S</text>
        <text x="230" y="148">D</text>
      </g>

      <!-- Calendar grid (5 weeks × 7 days). Default cell = light circle. -->
      <g font-size="11" font-weight="600" fill="#1e293b">
        <!-- Week 1 -->
        <text x="33"  y="178">28</text><text x="65"  y="178" fill="#94a3b8">29</text>
        <text x="97"  y="178" fill="#94a3b8">30</text><text x="129" y="178">1</text>
        <text x="161" y="178">2</text><text x="193" y="178">3</text><text x="225" y="178">4</text>
        <!-- Week 2 -->
        <text x="33"  y="208">5</text><text x="65"  y="208">6</text>
        <text x="97"  y="208">7</text><text x="129" y="208">8</text>
        <text x="161" y="208">9</text><text x="193" y="208">10</text><text x="225" y="208">11</text>
        <!-- Week 3 -->
        <text x="33"  y="238">12</text><text x="65"  y="238">13</text>
        <text x="97"  y="238">14</text><text x="129" y="238">15</text>
        <!-- Today highlight: 16 -->
        <circle cx="170" cy="234" r="13" fill="#6366f1"/>
        <text x="161" y="238" fill="#ffffff" font-weight="700">16</text>
        <text x="193" y="238">17</text><text x="225" y="238">18</text>
        <!-- Week 4 -->
        <text x="33"  y="268">19</text><text x="65"  y="268">20</text>
        <text x="97"  y="268">21</text><text x="129" y="268">22</text>
        <text x="161" y="268">23</text><text x="193" y="268">24</text><text x="225" y="268">25</text>
        <!-- Week 5 -->
        <text x="33"  y="298">26</text><text x="65"  y="298">27</text>
        <text x="97"  y="298">28</text><text x="129" y="298">29</text>
        <text x="161" y="298">30</text><text x="193" y="298">31</text><text x="225" y="298" fill="#94a3b8">1</text>
      </g>

      <!-- Event dots scattered under specific days -->
      <g>
        <circle cx="42"  cy="184" r="2.2" fill="#10b981"/>
        <circle cx="74"  cy="214" r="2.2" fill="#3b82f6"/>
        <circle cx="138" cy="214" r="2.2" fill="#f59e0b"/>
        <circle cx="170" cy="244" r="2.2" fill="#ec4899"/>
        <circle cx="202" cy="244" r="2.2" fill="#10b981"/>
        <circle cx="74"  cy="274" r="2.2" fill="#a855f7"/>
        <circle cx="138" cy="274" r="2.2" fill="#10b981"/>
        <circle cx="202" cy="304" r="2.2" fill="#3b82f6"/>
      </g>

      <!-- Divider -->
      <line x1="28" y1="334" x2="252" y2="334" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Tareas list -->
      <text x="28" y="358" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="1.5">TAREAS HOY</text>

      <!-- Task 1: done -->
      <g transform="translate(28, 372)">
        <rect x="0" y="0" width="224" height="32" rx="10" fill="#ecfdf5"/>
        <circle cx="18" cy="16" r="7" fill="#10b981"/>
        <path d="M 14 16 L 17 19 L 22 13" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="20" fill="#065f46" font-size="11" font-weight="600" text-decoration="line-through">Revisar reporte semanal</text>
      </g>

      <!-- Task 2: in progress -->
      <g transform="translate(28, 410)">
        <rect x="0" y="0" width="224" height="32" rx="10" fill="#fffbeb"/>
        <circle cx="18" cy="16" r="7" fill="#f59e0b"/>
        <polygon points="15,12 23,16 15,20" fill="#fff"/>
        <text x="34" y="20" fill="#92400e" font-size="11" font-weight="600">Diseñar pantalla nueva</text>
      </g>

      <!-- Task 3: todo -->
      <g transform="translate(28, 448)">
        <rect x="0" y="0" width="224" height="32" rx="10" fill="#f1f5f9"/>
        <circle cx="18" cy="16" r="7" fill="none" stroke="#64748b" stroke-width="1.6"/>
        <text x="34" y="20" fill="#334155" font-size="11" font-weight="600">Llamar a Sofía 🤝</text>
      </g>
    </g>

    <!-- Phone notch -->
    <rect x="110" y="22" width="60" height="14" rx="7" fill="#0f172a"/>
  </g>

</svg>
